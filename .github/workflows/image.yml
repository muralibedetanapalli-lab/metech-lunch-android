# Tests the backend, builds the dashboard, and publishes the API + dashboard image to
# GitHub Container Registry: ghcr.io/<owner>/metech-lunch:latest and :<commit sha>.
# Deploying that image to Azure is a separate step: deploy/azure.sh.
name: Backend image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "core/model/**"
      - "dashboard/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and package the backend
        run: ./gradlew :backend:test :backend:installDist

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build the dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/metech-lunch:latest
            ghcr.io/${{ github.repository_owner }}/metech-lunch:${{ github.sha }}
